[project]
name = "grocery-to-ticktick"
version = "0.1.0"
description = "Extract grocery items from images and sync them to TickTick"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.59.0",
  "fastapi>=0.116.1",
  "openai>=1.60.0",
  "pillow>=10.0.0",
  "pillow-heif>=0.13.0",
  "python-multipart>=0.0.20",
  "requests>=2.31.0",
  "uvicorn[standard]>=0.35.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
