name: Publish Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke_test:
    name: Smoke Test Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke-test:local

      - name: Run container
        run: |
          docker run -d --rm \
            -e API_KEY=smoke \
            -e OPENAI_API_KEY=smoke \
            -e TICKTICK_ACCESS_TOKEN=smoke \
            -p 8090:8090 \
            --name smoke-test \
            smoke-test:local

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8090/docs || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke-test || true
          exit 1

      - name: Verify auth required
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8090/api/ticktick/import || true)
          if [ "$code" != "401" ]; then
            docker logs smoke-test || true
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker stop smoke-test

  build_and_push:
    name: Build and Push GHCR Image
    runs-on: ubuntu-latest
    needs: smoke_test
    outputs:
      image_repository: ${{ steps.prep.outputs.image_repository }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image repository
        id: prep
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_repository=$repo" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.prep.outputs.image_repository }}:${{ github.sha }}
            ${{ steps.prep.outputs.image_repository }}:latest

      - name: Build digest-pinned image ref
        id: ref
        run: |
          image_ref="${{ steps.prep.outputs.image_repository }}@${{ steps.build.outputs.digest }}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "Published image ref: $image_ref"

  bump_nexus:
    name: Open PR to bump digest in nexus
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nexus
        uses: actions/checkout@v4
        with:
          repository: dkingman/nexus
          token: ${{ secrets.NEXUS_PAT }}

      - name: Update image ref
        env:
          IMAGE_KEY: TICK_IMAGE_REF
          IMAGE_REF: ${{ needs.build_and_push.outputs.image_ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("deploy/image-refs.env")
          key = os.environ["IMAGE_KEY"]
          value = os.environ["IMAGE_REF"]

          lines = path.read_text().splitlines()
          updated = False

          for i, line in enumerate(lines):
            if line.startswith(f"{key}="):
              lines[i] = f"{key}={value}"
              updated = True
              break

          if not updated:
            lines.append(f"{key}={value}")

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.NEXUS_PAT }}
          IMAGE_KEY: TICK_IMAGE_REF
          IMAGE_NAME: ticktick-grocery
          IMAGE_REF: ${{ needs.build_and_push.outputs.image_ref }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- deploy/image-refs.env; then
            echo "No image ref change detected; skipping PR."
            exit 0
          fi

          short_sha=$(echo "${SOURCE_SHA}" | cut -c1-7)
          branch="bump-${IMAGE_NAME}-${short_sha}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add deploy/image-refs.env
          git commit -m "chore: bump ${IMAGE_NAME} image digest"
          git push origin "$branch"

          body=$(printf 'Automated digest bump from [%s@%s](https://github.com/%s/commit/%s).\n\nUpdated %s to:\n\n`%s`\n' "$SOURCE_REPO" "$short_sha" "$SOURCE_REPO" "$SOURCE_SHA" "$IMAGE_KEY" "$IMAGE_REF")

          gh pr create \
            --title "Bump ${IMAGE_NAME} image digest" \
            --body "$body"
